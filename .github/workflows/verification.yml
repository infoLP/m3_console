# À chaque push et à chaque pull request : `npm run check` (typage strict, lint,
# tests, compilation de production), comme sur un poste. Aucune base. Repris du
# workflow de M3 (lui-même repris de M2_Console).
name: vérification

on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Cache de build Next gardé d'une exécution à l'autre : clé sur le lock et
      # le code, repli sur le dernier cache du même lock.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'shared/**', 'styles/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run check
